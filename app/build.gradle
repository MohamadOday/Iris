apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "nabu.iris.keyboard"
        compileSdk 36
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 151
        versionName "6.5.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    flavorDimensions "engine"
    productFlavors {
        mlkit {
            dimension "engine"
        }
        nomlkit {
            dimension "engine"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'nabu.iris.keyboard'
}

dependencies {
    mlkitImplementation 'com.google.mlkit:translate:17.0.3'
}
