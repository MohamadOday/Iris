name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v', e.g. v1.0.0

permissions:
  contents: write # Required to upload assets to GitHub Releases

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Remove Termux AAPT2 override for GitHub Actions
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          fi

      # Decrypt the keystore file from Base64 secret
      - name: Decode Keystore File
        if: env.KEYSTORE_BASE64 != null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks

      # Build and sign the Release APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # If keystore secret is present, build signed release APK
          if [ -f "app/my-release-key.jks" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            # Fallback if you haven't set up signing keys yet (builds unsigned release APK)
            ./gradlew assembleRelease
          fi

      # Rename release APK for cleaner release assets
      - name: Rename APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/iris-keyboard-${{ github.ref_name }}.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/iris-keyboard-${{ github.ref_name }}-unsigned.apk
          fi

      # Create a new GitHub Release and upload the built APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/iris-keyboard-*.apk
          name: Iris Keyboard ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
